[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-mcp"
version = "0.1.0"
description = "Attested multi-agent consensus with a shared blackboard -- an MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "theoddden"}]
dependencies = [
    "aiohttp>=3.9",
    "cryptography>=42.0",
    "stamp-mcp>=0.6.0",
]

[project.scripts]
quorum-mcp = "quorum_mcp.server:main"
quorum-mcp-http = "quorum_mcp.http_server:main"

[tool.setuptools.packages.find]
include = ["quorum_mcp*"]
