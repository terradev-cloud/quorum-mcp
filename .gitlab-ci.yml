# ---------------------------------------------------------------------------
# changelog — regenerate CHANGELOG.md from conventional commits (git-cliff)
# on every push to the default branch, committed back with [skip ci].
# ---------------------------------------------------------------------------

stages:
  - changelog

changelog:
  stage: changelog
  image: alpine:latest
  variables:
    GIT_DEPTH: "0" # git-cliff needs full history + tags
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
  script:
    - apk add --no-cache git git-cliff
    - git-cliff --output CHANGELOG.md
    - |
      if [ -z "$(git status --porcelain CHANGELOG.md)" ]; then
        echo "CHANGELOG.md unchanged"; exit 0
      fi
      git config user.email "theo@terradev.cloud"
      git config user.name "Theo Wolfenden"
      git add CHANGELOG.md
      git commit -m "chore: update CHANGELOG.md [skip ci]"
      git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_BRANCH}"

# ---------------------------------------------------------------------------
# sortie-index — a green pipeline on main triggers the Sortie indexer, which
# re-chunks and re-embeds this repo into Qdrant for the analyst agents.
# Requires SORTIE_TRIGGER_TOKEN + SORTIE_PROJECT_ID CI/CD variables.
# ---------------------------------------------------------------------------

sortie-index:
  stage: changelog
  image: alpine:latest
  rules:
    # Never fire from a trigger-sourced pipeline — that would loop.
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - apk add --no-cache curl
    - |
      curl -fsS -X POST \
        -F token="$SORTIE_TRIGGER_TOKEN" \
        -F ref=main \
        -F "variables[CHANGED_REPO]=$CI_PROJECT_NAME" \
        -F "variables[CHANGED_REPO_URL]=$CI_PROJECT_URL" \
        -F "variables[COMMIT_SHA]=$CI_COMMIT_SHA" \
        -F "variables[INDEX_REPOS]=$CI_PROJECT_PATH" \
        "https://gitlab.com/api/v4/projects/$SORTIE_PROJECT_ID/trigger/pipeline"
