services:
  quorum:
    build: .
    restart: unless-stopped
    env_file:
      - .env  # QUORUM_DATA_KEY etc. -- created on the instance, untracked
    volumes:
      - quorum-data:/data
    expose:
      - "8000"
    networks:
      - terradev

volumes:
  quorum-data:

networks:
  terradev:
    external: true
    name: terradev-cloud_terradev
